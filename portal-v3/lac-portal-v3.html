<!doctype html>
<!-- ============================================================
     LAC Customer Portal V3 — production build
     Vanilla JS, no framework. Standalone-testable (mock data) and
     ERPNext-ready (real endpoints via GET + credentials).
     Paste <style>+markup into the Web Page "Main Section (HTML)"
     field and the <script> body into the "JavaScript" field, OR
     serve this whole file as-is. See handoff guide.
     ============================================================ -->
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>LAC Customer Portal V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* When embedded in a Frappe Web Page, hide the default chrome. */
.page-head,.navbar,footer,.web-footer,#navbar,.navbar-fixed-top{display:none!important;}
.main-section,.page_content{padding:0!important;margin:0!important;max-width:100%!important;}

*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#0C1B33; --crimson:#D71E2B; --teal:#0E9C8E; --teal-t:#0B7E73;
  --gold:#C79A3A; --gold-d:#B8862F; --cream:#F4F5EF; --bg:#EDF2FA;
  --muted:#5E7085; --muted2:#8593A5; --line:rgba(12,27,51,.09);
  --sans:'Hanken Grotesk',system-ui,sans-serif; --serif:'Spectral',Georgia,serif;
  --accent:var(--crimson);           /* single theme knob */
  --shadow:0 4px 16px rgba(12,27,51,.05);
}
html,body{height:100%;}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(150% 90% at 50% -12%,#FFF 0%,#EEF4FC 46%,#E1EAF6 100%);}
img{display:block;} button{font-family:inherit;}
a{color:var(--teal-t);text-decoration:none;} a:hover{color:var(--ink);}
input{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:rgba(12,27,51,.14);border-radius:8px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
@keyframes shimmer{0%{background-position:-380px 0}100%{background-position:380px 0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}12%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,16px)}}

/* ---- shell ---- */
.app{display:flex;height:100vh;max-width:1440px;margin:0 auto;overflow:hidden;}
.rail{width:248px;flex-shrink:0;display:flex;flex-direction:column;padding:26px 18px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border-right:1px solid var(--line);}
.brand{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.01em;}
.brand b{color:var(--accent);}
.rail .nav{display:flex;flex-direction:column;gap:4px;margin-top:22px;}
.rail .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;
  border-radius:13px;border:none;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--muted);background:none;}
.rail .item svg{width:22px;height:22px;flex-shrink:0;}
.rail .item.on{font-weight:700;color:var(--ink);background:rgba(12,27,51,.055);}
.rail .item.on svg{stroke:var(--accent);}
.tiercard{margin-top:auto;border-radius:18px;padding:16px;background:linear-gradient(155deg,#0C1B33,#152f56);color:#fff;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;}
.topbar{flex-shrink:0;display:flex;align-items:center;gap:18px;padding:20px 30px;border-bottom:1px solid rgba(12,27,51,.07);}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal-t);font-weight:700;}
.ptitle{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.1;margin-top:2px;}
.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid rgba(12,27,51,.1);
  border-radius:13px;padding:10px 14px;box-shadow:0 2px 10px rgba(12,27,51,.04);}
.searchbar input{border:none;outline:none;flex:1;font-size:14px;background:none;min-width:0;color:var(--ink);}
.searchbar svg{width:18px;height:18px;stroke:var(--muted2);flex-shrink:0;}
.iconbtn{position:relative;width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid rgba(12,27,51,.1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 10px rgba(12,27,51,.04);color:var(--ink);}
.iconbtn svg{width:21px;height:21px;}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;
  min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px;}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid #fff;}
.avatar{width:44px;height:44px;border-radius:13px;background:linear-gradient(155deg,#0E9C8E,#0B7E73);color:#fff;border:none;
  font-family:var(--serif);font-size:17px;font-weight:600;cursor:pointer;}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;}
.wrap{max-width:960px;margin:0 auto;width:100%;padding:26px 30px 46px;}
.mhead{display:none;}
.tabbar{display:none;}

/* ---- generic ---- */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:13px;
  font-weight:700;font-size:14px;padding:12px 18px;cursor:pointer;color:#fff;background:var(--accent);
  box-shadow:0 6px 18px rgba(215,30,43,.28);}
.btn svg{width:18px;height:18px;}
.btn.full{width:100%;padding:15px;font-size:15px;}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px;}
.sec-h .t{font-family:var(--serif);font-size:20px;font-weight:600;}
.sec-h .lnk{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;}
.reveal{animation:rise .5s ease both;}

/* ---- home ---- */
.hero{border-radius:24px;padding:26px;background:linear-gradient(150deg,#0C1B33 0%,#16305a 100%);color:#fff;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;right:-80px;top:-110px;
  background:radial-gradient(circle,rgba(199,154,58,.30),transparent 62%);}
.hero .in{position:relative;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;}
.hero .lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.58);font-weight:700;}
.hero .bal{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1;margin-top:8px;}
.hero .bal small{font-size:17px;color:#E6C877;margin-left:8px;font-weight:700;}
.hero .tier{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:rgba(255,255,255,.72);}
.medal{display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:radial-gradient(circle at 38% 32%,#F0D98A,#C79A3A 62%,#9c7423);}
.track{height:7px;border-radius:20px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:12px;max-width:340px;}
.track .fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#C79A3A,#e6c877);}
.hero .checkin{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;
  padding:16px 18px;display:flex;align-items:center;gap:14px;}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;}
.qa .q{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;
  align-items:center;gap:9px;cursor:pointer;box-shadow:0 3px 12px rgba(12,27,51,.04);transition:transform .15s,box-shadow .15s;}
.qa .q:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(12,27,51,.10);}
.qa .q svg{width:26px;height:26px;} .qa .q .l{font-size:12px;font-weight:600;color:#334155;text-align:center;line-height:1.2;}
.featured{display:flex;gap:18px;align-items:center;padding:18px;}
.featured img{width:104px;height:104px;object-fit:contain;border-radius:14px;background:var(--cream);flex-shrink:0;}
.teasers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
.teaser{text-align:left;border:1px solid var(--line);border-radius:20px;padding:20px;cursor:pointer;background:#fff;box-shadow:var(--shadow);}
.teaser.club{border-top:3px solid var(--gold);}
.teaser.know{border:none;color:#fff;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(180deg,rgba(12,27,51,.15),rgba(12,27,51,.82)),linear-gradient(135deg,#0E9C8E,#0B7E73);}

/* ---- shop ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{white-space:nowrap;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid rgba(12,27,51,.1);background:#fff;color:#46586E;}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.prod{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;}
.prod:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(12,27,51,.10);}
.prod .ph{background:var(--cream);aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:10px;cursor:pointer;}
.prod .ph img{width:100%;height:100%;object-fit:contain;}
.prod .pb{padding:13px 14px 15px;display:flex;flex-direction:column;gap:5px;flex:1;}
.prod .pc{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-t);font-weight:600;}
.prod .pn{font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.25;}
.prod .rate{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--gold-d);font-weight:600;}
.prod .rate svg{width:14px;height:14px;stroke:var(--gold-d);}
.prod .pp{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;}
.prod .price{font-weight:800;font-size:15.5px;}
.prod .add{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;} .prod .add svg{width:19px;height:19px;stroke:#fff;}

/* ---- club ---- */
.medallion{width:104px;height:104px;margin:0 auto 12px;border-radius:50%;color:#5a4413;
  background:radial-gradient(circle at 40% 34%,#F0D98A,#C79A3A 60%,#9c7423);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(199,154,58,.35);}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0;}
.rung{text-align:center;padding:13px 4px;border-radius:14px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#F4F7FC;color:var(--muted);}
.rung svg{width:18px;height:18px;display:block;margin:0 auto 6px;stroke:var(--muted2);}
.rung.on{background:linear-gradient(155deg,#0C1B33,#152f56);color:#fff;border-color:#0C1B33;} .rung.on svg{stroke:#E6C877;}
.mission{display:flex;gap:13px;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line);}
.mission:last-child{border-bottom:none;}
.mission .mi{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mission .mi svg{width:20px;height:20px;}
.mission .mt{flex:1;min-width:0;} .mission .mtitle{font-weight:700;font-size:14px;}
.mission .mtrack{height:6px;border-radius:20px;background:#EEF2F8;overflow:hidden;margin-top:7px;}
.mission .mfill{height:100%;border-radius:20px;}
.mission .mtag{text-align:right;flex-shrink:0;font-size:12.5px;font-weight:700;}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.badge{text-align:center;padding:16px 8px;border-radius:16px;border:1px solid var(--line);}
.badge svg{width:26px;height:26px;display:block;margin:0 auto 8px;} .badge .bn{font-size:12px;font-weight:700;}

/* ---- knowledge ---- */
.art-hero{position:relative;border-radius:22px;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:24px;color:#fff;background:linear-gradient(180deg,rgba(12,27,51,.18),rgba(12,27,51,.84)),linear-gradient(135deg,#0E9C8E,#0B7E73);cursor:pointer;}
.art{display:flex;gap:14px;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line);cursor:pointer;}
.art:last-child{border-bottom:none;} .art:hover{background:#F6F8FC;}
.art .ai{width:44px;height:44px;border-radius:13px;background:rgba(14,156,142,.1);color:var(--teal-t);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.art .ai svg{width:20px;height:20px;} .art .an{font-family:var(--serif);font-size:15px;font-weight:600;margin-top:2px;}

/* ---- profile ---- */
.pcard{display:flex;align-items:center;gap:16px;padding:22px;}
.pavatar{width:66px;height:66px;border-radius:20px;background:linear-gradient(155deg,#0E9C8E,#0B7E73);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:28px;font-weight:600;flex-shrink:0;}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
.pstat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;}
.pstat .pv{font-family:var(--serif);font-size:24px;font-weight:600;} .pstat .pl{font-size:11.5px;color:var(--muted);margin-top:2px;}
.mgroup-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin:18px 4px 8px;}
.mrow{width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:15px 17px;border:none;border-bottom:1px solid var(--line);
  background:none;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--ink);}
.mrow:last-child{border-bottom:none;} .mrow:hover{background:#F6F8FC;}
.mrow>svg{width:20px;height:20px;stroke:var(--muted);flex-shrink:0;} .mrow .chev{margin-left:auto;stroke:#B8C2CE;}

/* ---- cart drawer / sheets / toast ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(12,27,51,.42);display:flex;justify-content:flex-end;animation:fade .2s ease;}
.drawer{width:420px;height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(12,27,51,.2);animation:slide .3s cubic-bezier(.2,.8,.2,1);}
.drawer-h{display:flex;align-items:center;justify-content:between;justify-content:space-between;padding:22px 22px 14px;}
.drawer-h .st{font-family:var(--serif);font-size:20px;font-weight:600;}
.cl{width:36px;height:36px;border-radius:11px;border:1px solid rgba(12,27,51,.1);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.cl svg{width:18px;height:18px;}
.drawer-b{flex:1;overflow-y:auto;padding:0 22px;}
.cline{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.cline img{width:58px;height:58px;object-fit:contain;background:var(--cream);border-radius:12px;}
.cline .cn{font-family:var(--serif);font-weight:600;font-size:14.5px;}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px;}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid rgba(12,27,51,.12);background:#fff;cursor:pointer;font-size:16px;}
.drawer-f{padding:16px 22px 22px;border-top:1px solid var(--line);}
.delnote{font-size:12.5px;color:var(--teal-t);background:rgba(14,156,142,.1);border-radius:12px;padding:10px 14px;margin-bottom:12px;}
.total{display:flex;justify-content:space-between;font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:14px;}
.empty{text-align:center;padding:70px 20px;color:var(--muted2);}
.empty svg{width:52px;height:52px;stroke:#C6D0DC;margin:0 auto;}
.empty .et{font-family:var(--serif);font-size:17px;color:var(--muted);margin-top:12px;}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;
  padding:13px 22px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 34px rgba(12,27,51,.32);animation:toast 2.4s ease forwards;}

/* ---- skeletons ---- */
.sk{background:linear-gradient(90deg,#eef2f8 25%,#e3e9f2 37%,#eef2f8 63%);background-size:760px 100%;animation:shimmer 1.3s infinite;border-radius:12px;}

/* ---- full-route screens ---- */
.mobile-search{display:none;}
.route-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.backbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
.backbtn svg{width:20px;height:20px;transform:rotate(180deg);}
.route-h .rt{font-family:var(--serif);font-size:22px;font-weight:600;}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
.pd .pimg{background:var(--cream);border-radius:22px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.pd .pimg img{max-width:100%;max-height:100%;object-fit:contain;}
.pd ul{margin:14px 0 0 18px;} .pd li{margin:6px 0;color:#334155;font-size:14px;}
.disclaimer{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:16px;line-height:1.5;}
.optcard{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;margin-bottom:10px;}
.optcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.optcard .radio{width:20px;height:20px;border-radius:50%;border:2px solid #C6D0DC;flex-shrink:0;}
.optcard.on .radio{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 5px,transparent 6px);}
.timeline{position:relative;padding-left:2px;}
.tstep{display:flex;gap:14px;padding-bottom:18px;position:relative;}
.tdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;z-index:1;}
.tstep.done .tdot{background:var(--teal);border-color:var(--teal);color:#fff;} .tdot svg{width:14px;height:14px;}
.tstep:not(:last-child)::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line);}
.tstep.done:not(:last-child)::before{background:var(--teal);}
.orow{padding:16px;border-bottom:1px solid var(--line);} .orow:last-child{border-bottom:none;}
.ostatus{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.chat{display:flex;flex-direction:column;gap:12px;padding:4px 0 20px;}
.bub{max-width:80%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.45;}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px;}
.bub.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;}
.chatbar{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0;background:linear-gradient(180deg,transparent,#E8EEF7 40%);}
.chatbar input{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:14px;outline:none;background:#fff;}
.sheet2{width:100%;max-width:460px;max-height:88vh;margin:auto auto 0;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:sheet .3s cubic-bezier(.2,.8,.2,1);}
.ov2{align-items:flex-end;justify-content:center;}
.notif{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);} .notif:last-child{border-bottom:none;}
.notif .ni{width:40px;height:40px;border-radius:12px;background:rgba(14,156,142,.1);color:var(--teal-t);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.notif .ni svg{width:19px;height:19px;}

/* ============ RESPONSIVE — mobile below 900px ============ */
@media(max-width:899px){
  .app{display:block;height:100vh;}
  .rail{display:none;}
  .main{height:100vh;}
  .topbar{display:none;}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;}
  .wrap{padding:4px 16px 24px;}

/* ---------------- cart ---------------- */
function prod(id){for(var i=0;i<S.products.length;i++){if(S.products[i].id===id||S.products[i].item_code===id)return S.products[i];}return null;}
function cartCount(){return S.cart.reduce(function(s,c){return s+c.qty;},0);}
function cartSum(){return S.cart.reduce(function(s,c){var p=prod(c.id);return s+(p?p.price*c.qty:0);},0);}
function addToCart(id,qty){var f=false;S.cart.forEach(function(c){if(c.id===id){c.qty+=(qty||1);f=true;}});if(!f)S.cart.push({id:id,qty:qty||1});toast('Сагсанд нэмэгдлээ');plog('cart_add',{id:String(id||'')});render();}
function setQty(id,d){S.cart=S.cart.map(function(c){return c.id===id?{id:id,qty:c.qty+d}:c;}).filter(function(c){return c.qty>0;});renderCart();render();}
function cartMath(){
  var gross=cartSum();
  var delivery=(gross===0)?0:((S.checkout.method==='ubcab')?0:(gross>=170000?0:5000));
  var bal=Number(S.customer&&S.customer.custom_loyalty_points)||0;
  var redeemMax=Math.round(gross*0.3);
  var redeemAmt=S.checkout.redeem?Math.min(bal,redeemMax):0;
  return {gross:gross,delivery:delivery,redeemAmt:redeemAmt,total:Math.max(0,gross+delivery-redeemAmt)};
}

/* ---------------- routing (hash + Back-button aware) ---------------- */
var FULLROUTES={product:1,checkout:1,assess:1,advisor:1,orders:1,subs:1};
function go(tab){ if(S.cartOpen)closeCart(true); if(S.sheet)closeSheet(true); location.hash='#/'+tab; }
function goRoute(name,param){ if(S.cartOpen)closeCart(true); if(S.sheet)closeSheet(true); location.hash='#/'+name+(param?('/'+encodeURIComponent(param)):''); }
function openCart(){ if(S.cartOpen)return; S.cartOpen=true; history.pushState({lacCart:1},''); renderCart(); }
function closeCart(fromPop){ if(!S.cartOpen)return; S.cartOpen=false; renderCart(); if(!fromPop && history.state && history.state.lacCart) history.back(); }
function openSheet(name,data){ if(S.sheet)closeSheet(true); S.sheet=name; S.sheetData=(data===undefined?null:data); if(name==='notif'){S.notifDot=false;render();} history.pushState({lacSheet:1},''); renderSheet(); }
function closeSheet(fromPop){ if(!S.sheet)return; S.sheet=null; S.sheetData=null; renderSheet(); if(!fromPop && history.state && history.state.lacSheet) history.back(); }
window.addEventListener('popstate',function(){ if(S.cartOpen){closeCart(true);} else if(S.sheet){closeSheet(true);} });
window.addEventListener('hashchange',syncHash);
function syncHash(){
  var parts=(location.hash||'').replace(/^#\/?/,'').split('/');
  var name=parts[0]||'home';
  var prevRoute=S.route&&S.route.name;
  if(TABS.indexOf(name)>=0){ S.tab=name; S.route=null; }
  else if(FULLROUTES[name]){ S.route={name:name,param:decodeURIComponent(parts[1]||'')}; }
  else { location.hash='#/home'; return; }
  if(prevRoute==='checkout'&&(!S.route||S.route.name!=='checkout')){ stopPayPoll(); S.checkout={method:'standard',redeem:false,pay:null,done:null}; }
  render();
  var sc=document.querySelector('.scroll'); if(sc)sc.scrollTop=0; window.scrollTo(0,0);
  plog('screen_view',{page:name});
  if(S.tab==='club'&&!S.club)loadClub().then(render);
  if(S.tab==='knowledge'&&!S.articles)loadArticles().then(render);
  if(S.route){
    if(S.route.name==='orders'&&S.orders===undefined)loadOrders().then(render);
    if(S.route.name==='subs'&&(S.subs===undefined||S.subs===null))loadSubs().then(render);
    if(S.route.name==='checkout'){
      if(!S.checkout.pay&&!S.checkout.done){ S.checkout={method:'standard',redeem:false,pay:null,done:null}; if(!STANDALONE){loadAddresses().then(function(){ if(S.addresses&&S.addresses.length&&!S.checkout.addr)S.checkout.addr=S.addresses[0].name; render(); });} plog('checkout_start',{}); }
    }
    if(S.route.name==='product'&&S.route.param)loadProductDetail(S.route.param);
  }
}

function confirmCheckout(){
  if(STANDALONE){ S.cart=[]; S.checkout.done={invoice:'LAC-DEMO',grand_total:cartMath().total}; render(); return; }
  if(!S.checkout.addr){ toast('Хүргэлтийн хаягаа сонгоно уу'); return; }
  var m=cartMath();
  var items=S.cart.map(function(c){return {item_code:c.id,qty:c.qty,rate:0};});
  var loy=(S.checkout.redeem&&m.redeemAmt>0)?String(Math.round(m.redeemAmt)):'0';
  toast('Захиалга үүсгэж байна…');
  apiPost('portal_customer_checkout',{
    customer:custName(), warehouse:'Ikh Mongol - L', delivery_address:S.checkout.addr,
    items:JSON.stringify(items), coupon_code:'', loyalty_points:loy, delivery_method:(S.checkout.method||'standard')
  }).then(function(d){
    if(d.payment_url){
      S.cart=[]; S.checkout.pay=d; render(); startPayPoll(d.invoice);
    } else { toast(d.error||'Төлбөр үүсгэхэд алдаа гарлаа'); }
  }).catch(function(){ toast('Сүлжээний алдаа'); });
}
function startPayPoll(inv){
  stopPayPoll(); S.payTries=0;
  S.payPollId=setInterval(function(){
    S.payTries++;
    if(!S.checkout.pay||S.payTries>45){ stopPayPoll(); return; }
    apiGet('portal_check_payment',{invoice:inv}).then(function(d){
      var m=(d&&d.message)||{};
      if(m.ok&&m.paid){ stopPayPoll(); S.checkout.pay=null; S.checkout.done={invoice:inv,grand_total:m.grand_total}; render(); loadMe().then(render); }
    }).catch(function(){});
  },4000);
}
function stopPayPoll(){ if(S.payPollId){clearInterval(S.payPollId);S.payPollId=null;} }
function checkPayNow(){
  var m=S.checkout.pay||{}; var inv=m.invoice; if(!inv)return;
  toast('Төлбөр шалгаж байна…');
  apiGet('portal_check_payment',{invoice:inv}).then(function(d){
    var r=(d&&d.message)||{};
    if(r.ok&&r.paid){ stopPayPoll(); S.checkout.pay=null; S.checkout.done={invoice:inv,grand_total:r.grand_total}; render(); loadMe().then(render); }
    else{ toast('Төлбөр хараахан баталгаажаагүй байна'); }
  }).catch(function(){toast('Сүлжээний алдаа');});
}

function downscalePhoto(file,cb){
  try{
    var img=new Image();var u=URL.createObjectURL(file);
    img.onload=function(){
      var mx=1024;var w=img.width||mx,ht=img.height||mx;var sc=Math.min(1,mx/Math.max(w,ht));
      var cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(ht*sc));
      var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      cv.getContext('2d').drawImage(img,0,0,cw,ch);URL.revokeObjectURL(u);
      if(cv.toBlob){cv.toBlob(function(bl){cb(bl||file);},'image/jpeg',0.82);}else{cb(file);}
    };
    img.onerror=function(){URL.revokeObjectURL(u);cb(file);};
    img.src=u;
  }catch(e){cb(file);}
}
function uploadPhoto(file,priv,cb){
  downscalePhoto(file,function(bl){
    var fd=new FormData();fd.append('file',bl,'photo.jpg');fd.append('is_private',priv?1:0);
    fetch(API_BASE+'/api/method/upload_file',{method:'POST',credentials:'include',
      headers:{'X-Frappe-CSRF-Token':(window.frappe&&frappe.csrf_token)||''},body:fd
    }).then(function(r){return r.json();}).then(function(res){cb((res&&res.message&&res.message.file_url)||'');}).catch(function(){cb('');});
  });
}

    '<div style="display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;" onclick="LAC.menu(\'info\')"><span style="color:var(--muted);display:flex;">'+icon('user','width="19" height="19"')+'</span><span style="flex:1;font-size:14.5px;">Хувийн мэдээлэл</span><span class="chev">'+icon('chev','width="16" height="16"')+'</span></div>'+
    '<a href="tel:+97670000000" style="display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;"><span style="color:var(--muted);display:flex;">'+icon('users','width="19" height="19"')+'</span><span style="flex:1;font-size:14.5px;">Тусламжийн төв</span><span class="chev">'+icon('chev','width="16" height="16"')+'</span></a>'+
    '<div style="display:flex;align-items:center;gap:12px;padding:14px 4px;"><span style="color:var(--muted);display:flex;">'+icon('doc','width="19" height="19"')+'</span><span style="flex:1;font-size:14.5px;">Аппын тухай</span><span style="color:var(--muted);font-size:13px;">v3.0</span></div>';
}
function togglePref(kind){
  if(STANDALONE){toast('Preview горим');return;}
  var c=S.customer||{};var cur=Number(c.marketing_sms_opt_in)===1;var next=cur?0:1;
  c.marketing_sms_opt_in=next;S.customer=c;renderSheet();
  var params={customer:custName()};
  if(kind==='sms')params.notif_sms=String(next);else params.notif_marketing=String(next);
  apiPost('portal_save_preferences',params).then(function(){toast('Хадгаллаа');}).catch(function(){toast('Алдаа гарлаа');});
}
function reportSheetBody(){
  return '<div style="padding:4px 0;"><div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">Алдаа, асуудал эсвэл саналаа бидэнд мэдэгдээрэй. Тусламжийн баг хариу өгнө.</div>'+
    '<input id="rep-subj" placeholder="Гарчиг (жиш: Төлбөр алдаатай)" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:8px;font-family:var(--sans);outline:none;">'+
    '<textarea id="rep-desc" rows="4" placeholder="Дэлгэрэнгүй..." style="width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px;resize:vertical;font-family:var(--sans);outline:none;"></textarea>'+
    '<button class="btn full" style="margin-top:12px;" onclick="LAC.reportSend()">Илгээх</button></div>';
}
function submitReport(){
  if(STANDALONE){toast('Preview горим');return;}
  var subj=(($('rep-subj')&&$('rep-subj').value)||'').trim();
  var desc=(($('rep-desc')&&$('rep-desc').value)||'').trim();
  if(!subj&&!desc){toast('Тайлбараа бичнэ үү');return;}
  apiPost('portal_report_issue',{subject:subj,description:desc}).then(function(m){
    closeSheet();
    if(m&&m.ok){toast('✓ Хүлээн авлаа. Баярлалаа!');}else{toast('Илгээж чадсангүй');}
  }).catch(function(){toast('Сүлжээний алдаа');});
}
function doWallet(){
  if(STANDALONE){toast('Preview горим');return;}
  toast('Wallet холбоос бэлдэж байна…');
  apiPost('portal_get_passkit_link',{customer:custName()}).then(function(m){
    if(m.ok&&m.passkit_url){window.open(m.passkit_url,'_blank','noopener');}
    else{toast('Wallet холбоос бэлэн болоогүй байна');}
  }).catch(function(){toast('Сүлжээний алдаа');});
}

/* ---- reviews ---- */
function reviewsSheetBody(){
  var R=S.reviews;
  if(R===null)return loadingBlock();
  R=R||{};var revs=R.reviews||[];var avg=R.average||0;var total=R.total||0;var dist=R.distribution||{};
  var head='<div style="text-align:center;margin-bottom:14px;"><div style="font-size:34px;font-weight:800;font-family:var(--serif);line-height:1;">'+avg+'</div>'+
    '<div style="color:var(--gold-d);font-size:18px;margin-top:4px;">'+starRow(Math.round(avg))+'</div>'+
    '<div style="color:var(--muted);font-size:13px;">'+total+' үнэлгээ</div></div>';
  var bars='';
  for(var st=5;st>=1;st--){var cnt=Number(dist[st]||dist[String(st)]||0);var pct=total?Math.round(cnt/total*100):0;
    bars+='<div style="display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px;"><span style="width:12px;">'+st+'</span><div style="flex:1;height:7px;background:var(--cream);border-radius:4px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:var(--gold);"></div></div><span style="width:28px;text-align:right;color:var(--muted);">'+cnt+'</span></div>';}
  var list=revs.length?revs.map(function(v){
    return '<div style="padding:12px 0;border-bottom:1px solid var(--line);"><div style="display:flex;justify-content:space-between;align-items:center;"><b style="font-size:13.5px;">'+esc(v.reviewer_name||'Хэрэглэгч')+'</b><span style="color:var(--gold-d);font-size:13px;">'+starRow(v.rating||0)+'</span></div>'+
      (v.review_title?'<div style="font-weight:600;font-size:13px;margin-top:4px;">'+esc(v.review_title)+'</div>':'')+
      (v.review_text?'<div style="font-size:13px;color:var(--muted);margin-top:2px;">'+esc(v.review_text)+'</div>':'')+
      '<div style="font-size:11px;color:var(--muted);margin-top:4px;">'+esc(String(v.submission_date||''))+'</div></div>';
  }).join(''):'<div style="text-align:center;color:var(--muted);font-size:13px;padding:10px 0;">Одоогоор сэтгэгдэл алга. Хамгийн түрүүнд бичээрэй!</div>';
  var draft=S.reviewDraft||{rating:5};
  var starPick='';for(var k=1;k<=5;k++){starPick+='<span onclick="LAC.pickStar('+k+')" style="font-size:26px;cursor:pointer;color:var(--gold-d);margin-right:2px;">'+(k<=(draft.rating||5)?'★':'☆')+'</span>';}
  var form='<div class="card" style="padding:14px;margin-top:14px;"><div style="font-weight:600;margin-bottom:8px;">Сэтгэгдэл бичих</div>'+
    '<div style="margin-bottom:8px;">'+starPick+'</div>'+
    '<input id="rv-title" placeholder="Гарчиг" value="'+esc(draft.title||'')+'" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-family:var(--sans);font-size:14px;outline:none;">'+
    '<textarea id="rv-text" placeholder="Таны туршлага..." style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-family:var(--sans);font-size:14px;outline:none;min-height:70px;resize:vertical;">'+esc(draft.text||'')+'</textarea>'+
    '<button class="btn full" onclick="LAC.reviewSend()">Илгээх</button></div>';
  return head+'<div style="margin-bottom:12px;">'+bars+'</div>'+list+form;
}
function submitReview(){
  if(STANDALONE){toast('Preview горим');return;}
  var code=S.reviewItem||'';
  var draft=S.reviewDraft||{rating:5};
  var title=(($('rv-title')&&$('rv-title').value)||'').trim();
  var text=(($('rv-text')&&$('rv-text').value)||'').trim();
  if(!text){toast('Сэтгэгдлээ бичнэ үү');return;}
  apiPost('portal_submit_review',{customer:custName(),item_code:code,rating:String(draft.rating||5),title:title,text:text}).then(function(m){
    if(m.ok){toast('Баярлалаа! Сэтгэгдэл хянагдана.');S.reviewDraft={rating:5};loadReviews(code);}
    else{toast(m.error||'Алдаа гарлаа');}
  }).catch(function(){toast('Сүлжээний алдаа');});
}

/* ---------------- secondary sheets ---------------- */
function renderSheet(){
  var root=$('overlay2'); if(!root)return;
  if(!S.sheet){root.innerHTML='';return;}
  var title='',body='';
  if(S.sheet==='notif'){title='Мэдэгдэл';
    if(STANDALONE){body=MOCK.notifs.map(function(n){return '<div class="notif"><span class="ni">'+icon(n.icon,'width="19" height="19"')+'</span><div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:14px;">'+esc(n.title)+(n.unread?' <span style="color:var(--accent);">•</span>':'')+'</div><div style="font-size:13px;color:var(--muted);margin:2px 0;">'+esc(n.body)+'</div><div style="font-size:11.5px;color:var(--muted2);">'+esc(n.time)+'</div></div></div>';}).join('');}
    else{body='<div class="empty">'+icon('bell','width="46" height="46"')+'<div class="et">Шинэ мэдэгдэл алга</div></div>';}}
  else if(S.sheet==='referral'){var r=S.referral||MOCK.referral;title='Найз урих';
    body='<div style="text-align:center;padding:6px 0 10px;"><div style="font-size:14px;color:var(--muted);line-height:1.5;">Найзаа урьж <b style="color:var(--ink);">+'+r.reward+' LAC$</b>, найз чинь <b style="color:var(--ink);">+'+r.friendReward+' LAC$</b> аваарай</div>'+
      '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0;"><div style="font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.12em;background:#fff;border:1px dashed var(--accent);border-radius:12px;padding:12px 20px;">'+esc(r.code)+'</div>'+
      '<button class="iconbtn" aria-label="Хуулах" onclick="LAC.copy(\''+esc(r.code)+'\')">'+icon('doc')+'</button></div>'+
      '<div style="font-size:13px;color:var(--muted);">'+r.invited+'/'+r.target+' найз урьсан</div></div>';}
  else if(S.sheet==='tracking'){
    title='Захиалга хянах'+(S.trackingInv?' · '+esc(S.trackingInv):'');
    if(S.tracking===null){body=loadingBlock();}
    else{
      var t=S.tracking||{};var stages=t.stages||[];
      if(!stages.length){body='<div class="empty"><div class="et">Мэдээлэл олдсонгүй</div></div>';}
      else{
        body='<div class="timeline">'+stages.map(function(s){return '<div class="tstep '+(s.done?'done':'')+'"><div class="tdot">'+(s.done?icon('check','width="14" height="14" stroke-width="2.4"'):'')+'</div><div><div style="font-weight:700;font-size:14px;">'+esc(s.label||s.t||'')+'</div><div style="font-size:12px;color:var(--muted2);">'+esc(s.ts||s.time||'—')+'</div></div></div>';}).join('')+'</div>'+
        '<div class="card" style="padding:14px;margin-top:14px;text-align:center;"><div style="font-size:12px;color:var(--muted);">Хүргэгдэх хугацаа</div><div style="font-weight:700;font-size:16px;margin-top:2px;">'+esc(t.eta||'24–48 цаг')+'</div>'+
        (t.is_ubcab?'<div style="font-size:12px;color:var(--muted);margin-top:6px;">UBCab-аар хүргэгдэнэ · хүлээн авагч төлбөрөө төлнө</div>':'')+'</div>';
      }
    }
  }
  else if(S.sheet==='addr'){title='Миний хаяг';body=addrSheetBody();}
  else if(S.sheet==='saved'){title='Хадгалсан';body=savedSheetBody();}
  else if(S.sheet==='info'){title='Хувийн мэдээлэл';body=infoSheetBody();}
  else if(S.sheet==='settings'){title='Тохиргоо';body=settingsSheetBody();}
  else if(S.sheet==='report'){title='Асуудал мэдээлэх';body=reportSheetBody();}
  else if(S.sheet==='reviews'){title='Үнэлгээ, сэтгэгдэл';body=reviewsSheetBody();}
  else if(S.sheet==='article'){title='Нийтлэл';body=articleSheetBody();}
  else if(S.sheet==='habit'){title='Эрүүл зуршил';body=habitSheetBody();}
  else if(S.sheet==='mission'){title='Даалгавар';body=missionSheetBody();}
  root.innerHTML='<div class="ov ov2" onclick="LAC.closeSheet()"><div class="sheet2" onclick="event.stopPropagation()">'+
    '<div class="drawer-h"><div class="st">'+title+'</div><button class="cl" aria-label="Хаах" onclick="LAC.closeSheet()">'+icon('close')+'</button></div>'+
    '<div class="drawer-b" style="padding-bottom:22px;">'+body+'</div></div></div>';
}

function screenHTML(){
  if(S.route){
    return ({product:productHTML,checkout:checkoutHTML,assess:assessHTML,advisor:advisorHTML,orders:ordersHTML,subs:subsHTML}[S.route.name]||function(){return '';})(S.route.param);
  }
  if(S.loading)return skeletonHTML();
  return {home:homeHTML,shop:shopHTML,club:clubHTML,knowledge:knowledgeHTML,profile:profileHTML}[S.tab]();
}

/* ---------------- render: cart drawer ---------------- */
function renderCart(){
  var root=$('overlay');
  if(!S.cartOpen){root.innerHTML='';return;}
  var lines=S.cart.map(function(c){var p=prod(c.id);if(!p)return '';
    return '<div class="cline"><img src="'+esc(p.img||p.image||'')+'" onerror="LAC.imgf(this)" alt=""><div style="flex:1;min-width:0;"><div class="cn">'+esc(p.name)+'</div>'+
      '<div style="font-size:13px;color:var(--muted);margin-top:2px;">'+fmt(p.price)+'</div>'+
      '<div class="qty"><button aria-label="Хасах" onclick="LAC.qty(\''+esc(c.id)+'\',-1)">−</button><span style="font-weight:700;min-width:18px;text-align:center;">'+c.qty+'</span><button aria-label="Нэмэх" onclick="LAC.qty(\''+esc(c.id)+'\',1)">+</button></div></div></div>';
  }).join('');
  var sum=cartSum();var toFree=170000-sum;
  var body = S.cart.length ? lines : '<div class="empty">'+icon('cart','width="52" height="52"')+'<div class="et">Сагс хоосон байна</div><div style="font-size:13px;margin-top:4px;">Дэлгүүрээс бүтээгдэхүүн нэмээрэй</div></div>';
  var footer = S.cart.length ? '<div class="drawer-f"><div class="delnote">'+(sum>=170000?'✓ Үнэгүй хүргэлтэд хүрсэн байна':'Үнэгүй хүргэлт хүртэл '+fmt(toFree)+' үлдлээ')+'</div>'+
    '<div class="total"><span>Нийт</span><span>'+fmt(sum)+'</span></div><button class="btn full" onclick="LAC.checkout()">Захиалга үргэлжлүүлэх</button></div>' : '';
  root.innerHTML='<div class="ov" onclick="LAC.closeCart()"><div class="drawer" onclick="event.stopPropagation()">'+
    '<div class="drawer-h"><div class="st">Таны сагс</div><button class="cl" aria-label="Хаах" onclick="LAC.closeCart()">'+icon('close')+'</button></div>'+
    '<div class="drawer-b">'+body+'</div>'+footer+'</div></div>';
}

/* ---------------- render root ---------------- */
function render(){
  $('app').innerHTML='<div class="app">'+railHTML()+
    '<div class="main">'+topbarHTML()+mheadHTML()+
      '<div class="scroll"><div class="wrap">'+screenHTML()+'</div></div>'+
      tabbarHTML()+
    '</div></div>';
  renderCart();
  renderSheet();
}

/* ---------------- public API (for inline onclick) ---------------- */
window.LAC={
  go:function(t){ go(t); },
  product:function(id){ goRoute('product',id); },
  openCart:openCart, closeCart:function(){closeCart();},
  openSheet:openSheet, closeSheet:function(){closeSheet();},
  add:function(id){addToCart(id,1);}, qty:setQty,
  cat:function(c){S.cat=c;render();}, search:function(v){S.q=v; if(S.tab!=='shop'||S.route){go('shop');} else render();},
  checkin:doCheckin,
  quick:function(a){ if(a==='shop')go('shop'); else if(a==='order')goRoute('orders'); else if(a==='assess'){S.quiz={step:0,answers:{},results:null,loading:false};goRoute('assess');} else goRoute('advisor'); },
  menu:function(k){
    if(k==='orders')goRoute('orders');
    else if(k==='subs')goRoute('subs');
    else if(k==='referral'){openSheet('referral');loadReferral();}
    else if(k==='addr'){openSheet('addr');if(S.addresses===undefined||S.addresses===null)loadAddresses().then(renderSheet);else renderSheet();}
    else if(k==='saved'){openSheet('saved');if(S.wishlist===undefined||S.wishlist===null)loadWishlist().then(renderSheet);else renderSheet();}
    else if(k==='wallet')doWallet();
    else if(k==='info'){S.phoneChange=null;openSheet('info');}
    else if(k==='settings')openSheet('settings');
    else if(k==='report')openSheet('report');
  },
  notif:function(){ openSheet('notif'); },
  checkout:function(){ if(!S.cart.length){toast('Сагс хоосон байна');return;} goRoute('checkout'); },
  method:function(m){ S.checkout.method=m; render(); },
  toggleRedeem:function(){ S.checkout.redeem=!S.checkout.redeem; render(); },
  pickAddr:function(n){ S.checkout.addr=n; render(); },
  addrForm:function(on){ S.addressForm=on?{}:null; render(); renderSheet(); },
  saveAddr:saveAddress, delAddr:deleteAddress,
  confirmOrder:confirmCheckout, checkPay:checkPayNow,
  track:function(id){ S.trackingInv=id; S.tracking=null; openSheet('tracking'); if(!STANDALONE)loadTracking(id); else {S.tracking=MOCK.tracking; renderSheet();} },
  reorder:doReorder, pdf:doInvoicePdf,
  cancelSub:cancelSub, restartSub:restartSub, activateSub:activatePendingSub, subscribe:subscribeItem,
  send:advisorSend,
  quizAnswer:function(key,val){ S.quiz.answers[key]=val; if(S.quiz.step<QUIZ_STEPS.length-1){S.quiz.step++;render();} else {quizSubmit();} },
  quizBack:function(){ if(S.quiz.step>0){S.quiz.step--;render();} },
  quizReset:function(){ S.quiz={step:0,answers:{},results:null,loading:false}; render(); },
  copy:function(t){ try{navigator.clipboard&&navigator.clipboard.writeText(t);}catch(e){} toast('Код хуулагдлаа'); },
  article:openArticle,
  habit:function(id){ openSheet('habit',id); },
  habitShot:startHabitCapture,
  mission:function(idx){ S.currentMission=(S.missionsRaw||[])[idx]; S.missionProof=''; if(S.currentMission)openSheet('mission'); },
  missionPhoto:function(input){
    if(!input||!input.files||!input.files[0])return;
    toast('Зураг ачааллаж байна…');
    uploadPhoto(input.files[0],false,function(url){ S.missionProof=url; if(!url)toast('Зураг ачаалахад алдаа гарлаа'); renderSheet(); });
  },
  missionSubmit:doSubmitMission,
  redeemAsk:function(id){ S.rewardConfirm=id; render(); },
  redeem:doRedeem,
  wish:toggleWishlist,
  reviews:function(code){ S.reviewItem=code; S.reviews=null; S.reviewDraft={rating:5}; openSheet('reviews',code); if(!STANDALONE)loadReviews(code); else {S.reviews={reviews:[],total:0,average:0,distribution:{}};renderSheet();} },
  pickStar:function(k){ var t=$('rv-title'),x=$('rv-text'); S.reviewDraft={rating:k,title:(t&&t.value)||'',text:(x&&x.value)||''}; renderSheet(); },
  reviewSend:submitReview,
  otpStart:function(){ S.phoneChange={step:'enter',newPhone:''}; renderSheet(); },
  otpCancel:function(){ S.phoneChange=null; renderSheet(); },
  otpRestart:function(){ S.phoneChange={step:'enter',newPhone:''}; renderSheet(); },
  otpSend:phoneOtpSend, otpVerify:phoneOtpVerify,
  saveInfo:saveInfo, pref:togglePref,
  reportSend:submitReport,
  toast:toast, imgf:imgFallback
};

/* ---------------- init ---------------- */
if(!location.hash)location.hash='#/home';
syncHash();      // set S.tab from URL
boot();          // load data, then render
})();
</script>
</body>
</html>
